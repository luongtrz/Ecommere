name: thaispray-stack

services:
  edge:
    image: caddy:2
    container_name: thaispray-edge
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - admin-frontend
      - admin-backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - thaispray-net

  backend:
    build:
      context: ./user_ecommere/backend
    container_name: thaispray-user-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - ./user_ecommere/backend/.env
    volumes:
      - ./user_ecommere/backend/uploads:/app/uploads
    networks:
      - thaispray-net

  frontend:
    build:
      context: ./user_ecommere/frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: thaispray-user-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - thaispray-net

  admin-backend:
    build:
      context: ./admin_ecommere/backend
    container_name: thaispray-admin-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - ./admin_ecommere/backend/.env
    volumes:
      - ./admin_ecommere/backend/uploads:/app/uploads
    networks:
      - thaispray-net

  admin-frontend:
    build:
      context: ./admin_ecommere/frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_STORE_URL: "https://ecommere.luongtrz.me"
    container_name: thaispray-admin-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - thaispray-net

networks:
  thaispray-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
